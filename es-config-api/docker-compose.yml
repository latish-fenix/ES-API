services:
  es-config-api:
    build: .
    image: es-config-api:latest
    restart: unless-stopped
    ports:
      # Host port from API_PORT in .env (e.g. API_PORT=80); restrict it with the security group
      - "${API_PORT:-8080}:8080"
    env_file: .env           # S3 settings, bootstrap admins, ES credentials
    volumes:
      - ./config/clusters.yaml:/app/config/clusters.yaml:ro
      - ./certs:/app/certs:ro # CA certificates referenced from clusters.yaml
      # Clusters added in the console / admin API are saved in ./data/clusters.managed.yaml
      # (with their credentials, mode 600). The folder must be writable by the container:
      #   mkdir -p data && sudo chown 10001:10001 data && chmod 700 data
      - ./data:/app/data
    # On EC2 the instance IAM role provides AWS credentials; no keys needed here.
